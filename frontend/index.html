<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>CareerQuest — Sign In</title>
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

    :root {
      --primary: #6366f1;
      --primary-dark: #4f46e5;
      --primary-light: #e0e7ff;
      --text: #111827;
      --muted: #6b7280;
      --border: #e5e7eb;
      --bg: #f5f7ff;
      --card: #ffffff;
      --error: #dc2626;
      --radius: 12px;
    }

    body {
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, 'Helvetica Neue', Arial, sans-serif;
      background: var(--bg);
      color: var(--text);
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      padding: 24px 20px;
    }

    /* ── Card ── */
    .card {
      background: var(--card);
      border: 1px solid var(--border);
      border-radius: 20px;
      padding: 44px 40px;
      width: 100%;
      max-width: 420px;
      box-shadow: 0 8px 40px rgba(99, 102, 241, 0.10);
    }

    /* ── Logo ── */
    .brand {
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 10px;
      margin-bottom: 28px;
      text-decoration: none;
    }

    .brand-icon {
      width: 40px;
      height: 40px;
      background: var(--primary);
      border-radius: 10px;
      display: flex;
      align-items: center;
      justify-content: center;
      color: #fff;
      flex-shrink: 0;
    }

    .brand-name {
      font-size: 1.3rem;
      font-weight: 800;
      color: var(--text);
      letter-spacing: -0.4px;
    }

    .brand-name span { color: var(--primary); }

    /* ── Headings ── */
    .card h1 {
      font-size: 1.65rem;
      font-weight: 800;
      letter-spacing: -0.5px;
      text-align: center;
      margin-bottom: 6px;
    }

    .subtitle {
      font-size: 0.9rem;
      color: var(--muted);
      text-align: center;
      margin-bottom: 32px;
      line-height: 1.5;
    }

    /* ── Input fields ── */
    .field { margin-bottom: 16px; }

    label {
      display: block;
      font-size: 0.83rem;
      font-weight: 600;
      color: var(--text);
      margin-bottom: 6px;
    }

    .input-wrap {
      position: relative;
      display: flex;
      align-items: center;
    }

    .input-icon {
      position: absolute;
      left: 13px;
      color: #9ca3af;
      pointer-events: none;
      display: flex;
    }

    input {
      width: 100%;
      padding: 11px 14px 11px 40px;
      border: 1.5px solid var(--border);
      border-radius: 9px;
      font-size: 0.95rem;
      color: var(--text);
      background: var(--card);
      outline: none;
      transition: border-color 0.15s, box-shadow 0.15s;
      font-family: inherit;
    }

    input::placeholder { color: #9ca3af; }

    input:focus {
      border-color: var(--primary);
      box-shadow: 0 0 0 3px rgba(99, 102, 241, 0.12);
    }

    /* ── Buttons ── */
    .btn {
      width: 100%;
      padding: 13px;
      border-radius: 9px;
      font-size: 0.97rem;
      font-weight: 700;
      cursor: pointer;
      transition: background 0.18s, transform 0.18s, box-shadow 0.18s, color 0.18s;
      font-family: inherit;
      letter-spacing: -0.1px;
      border: none;
    }

    .btn-primary {
      background: var(--primary);
      color: #fff;
      margin-top: 8px;
    }

    .btn-primary:hover {
      background: var(--primary-dark);
      transform: translateY(-1px);
      box-shadow: 0 6px 20px rgba(99, 102, 241, 0.35);
    }

    .btn-primary:active { transform: translateY(0); }

    /* ── Error message ── */
    #auth-message {
      margin-top: 12px;
      font-size: 0.875rem;
      font-weight: 500;
      min-height: 20px;
      text-align: center;
      color: var(--error);
    }

    /* ── Sign up link ── */
    .signup-link {
      text-align: center;
      font-size: 0.875rem;
      color: var(--muted);
      margin-top: 24px;
    }

    .signup-link a {
      color: var(--primary);
      font-weight: 600;
      text-decoration: none;
    }

    .signup-link a:hover { text-decoration: underline; }

    /* ── Responsive ── */
    @media (max-width: 480px) {
      .card { padding: 32px 24px; }
    }
  </style>
</head>
<body>

  <div class="card">

    <a href="/frontend/landing.html" class="brand">
      <div class="brand-icon">
        <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
          <path d="M9.5 2A2.5 2.5 0 0 1 12 4.5v15a2.5 2.5 0 0 1-4.96-.46 2.5 2.5 0 0 1-2.96-3.08 3 3 0 0 1-.34-5.58 2.5 2.5 0 0 1 1.32-4.24 2.5 2.5 0 0 1 1.98-3A2.5 2.5 0 0 1 9.5 2Z"/>
          <path d="M14.5 2A2.5 2.5 0 0 0 12 4.5v15a2.5 2.5 0 0 0 4.96-.46 2.5 2.5 0 0 0 2.96-3.08 3 3 0 0 0 .34-5.58 2.5 2.5 0 0 0-1.32-4.24 2.5 2.5 0 0 0-1.98-3A2.5 2.5 0 0 0 14.5 2Z"/>
        </svg>
      </div>
      <span class="brand-name">Career<span>Quest</span></span>
    </a>

    <h1>Welcome Back</h1>
    <p class="subtitle">Continue your journey to career confidence</p>

    <div class="field">
      <label for="email">Email</label>
      <div class="input-wrap">
        <span class="input-icon">
          <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
            <rect width="20" height="16" x="2" y="4" rx="2"/>
            <path d="m22 7-8.97 5.7a1.94 1.94 0 0 1-2.06 0L2 7"/>
          </svg>
        </span>
        <input id="email" type="email" placeholder="you@example.com" autocomplete="email" />
      </div>
    </div>

    <div class="field">
      <label for="password">Password</label>
      <div class="input-wrap">
        <span class="input-icon">
          <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
            <rect width="18" height="11" x="3" y="11" rx="2" ry="2"/>
            <path d="M7 11V7a5 5 0 0 1 10 0v4"/>
          </svg>
        </span>
        <input id="password" type="password" placeholder="••••••••" autocomplete="current-password" />
      </div>
    </div>

    <button class="btn btn-primary" type="button" onclick="login()">Sign In</button>

    <div id="auth-message"></div>

    <p class="signup-link">Don't have an account? <a href="/register">Sign up</a></p>

  </div>

  <script src="/frontend/script.js"></script>

</body>
</html>
