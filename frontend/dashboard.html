<!DOCTYPE html>
<html>
<head>
  <title>Dashboard</title>
  <link rel="stylesheet" href="/frontend/style.css">
</head>
<body class="dashboard-container">

<div class="welcome-section">
  <h1 id="welcome-text">Hey 👋</h1>
  <p>Let's start your interview journey.</p>
</div>

<div class="main-content">

  <div class="dashboard-card">

    <h2>Start Your Practice</h2>

    <input type="hidden" id="name">

    <input
        type="text"
        id="domain"
        placeholder="Enter any topic (e.g. React, DevOps, AI)"
    >

    <button class="dashboard-btn" onclick="startInterview()">
      Start Interview
    </button>

    <button class="dashboard-btn logout-btn" onclick="logout()">
      Logout
    </button>

  </div>

</div>

<script>
  let currentUser = null;

  fetch("/me")
    .then(res => {
      if (!res.ok) window.location.href = "/";
      return res.json();
    })
    .then(user => {
      currentUser = user;
      document.getElementById("welcome-text").textContent = `Hey ${user.name}, Welcome! 👋`;
      document.getElementById("name").value = user.name;
    });
</script>

<script src="/frontend/script.js"></script>
</body>
</html>
