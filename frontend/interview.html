<!DOCTYPE html>
<html>

<head>
    <title>Interview Session</title>
    <link rel="stylesheet" href="/frontend/style.css">
</head>

<body>

<!-- Sidebar -->

<div class="sidebar">
    <h2>Interview</h2>

    <div class="sidebar-bottom">
        <button onclick="logout()">Logout</button>
    </div>
</div>

<!-- Main Content -->

<div class="main-content">

    <!-- Top Bar -->

    <div class="top-bar">

        <div class="interview-info">
            <span id="domain-title">Interview</span>
            <span id="difficulty">Easy</span>
        </div>

        <!-- <div class="timer">
            ⏱ Time: <span id="time">10:00</span>
        </div> -->

    </div>

    <!-- Question Card -->

    <div class="question-card">

        <div class="question-header">
            Question <span id="question-number">1</span> /
            <span id="total-questions">20</span>
        </div>

        <div class="question-text" id="question">
            Loading question...
        </div>

    </div>

    <!-- Answer Section -->

    <div class="answer-card">

        <textarea id="answer" placeholder="Write your answer here..."></textarea>

        <div class="actions">

            <button type="button" onclick="submitAnswer()">Submit Answer</button>

            <button type="button" id="next-btn" class="secondary-btn" style="display:none;">
                Next
            </button>

            <button type="button" class="secondary-btn" onclick="skipQuestion()">
                Skip
            </button>

        </div>

    </div>

    <!-- Feedback -->

    <div class="feedback-card" id="feedback">
        <!-- Feedback will appear here -->
    </div>

</div>

<script src="/frontend/script.js"></script>

<script>
    // Optional: Skip handler (you can connect backend later)
    function skipQuestion() {
        alert("Skip feature not implemented yet");
    }
</script>

</body>

</html>
