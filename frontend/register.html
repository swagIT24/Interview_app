<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Create Account — Opunto</title>
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

    :root {
      --primary: #6366f1;
      --primary-dark: #4f46e5;
      --primary-light: #e0e7ff;
      --text: #111827;
      --muted: #6b7280;
      --border: #e5e7eb;
      --bg: #f9fafb;
      --card: #ffffff;
      --error: #dc2626;
      --success: #16a34a;
      --radius: 12px;
    }

    body {
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, 'Helvetica Neue', Arial, sans-serif;
      background: var(--bg);
      color: var(--text);
      min-height: 100vh;
      display: flex;
      flex-direction: column;
    }

    /* ── Navbar ── */
    nav {
      background: rgba(255, 255, 255, 0.92);
      backdrop-filter: blur(12px);
      border-bottom: 1px solid var(--border);
      padding: 0 24px;
      height: 60px;
      display: flex;
      align-items: center;
    }

    .logo {
      display: flex;
      align-items: center;
      gap: 10px;
      text-decoration: none;
      font-size: 1.15rem;
      font-weight: 700;
      color: var(--text);
      letter-spacing: -0.3px;
    }

    .logo-icon {
      width: 30px;
      height: 30px;
      background: var(--primary);
      border-radius: 7px;
      display: flex;
      align-items: center;
      justify-content: center;
      color: #fff;
      font-size: 0.9rem;
    }

    .logo span { color: var(--primary); }

    /* ── Main layout ── */
    main {
      flex: 1;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 40px 20px;
    }

    .card {
      background: var(--card);
      border: 1px solid var(--border);
      border-radius: 20px;
      padding: 44px 40px;
      width: 100%;
      max-width: 440px;
      box-shadow: 0 8px 32px rgba(99, 102, 241, 0.08);
    }

    /* ── Card header ── */
    .card-icon {
      width: 52px;
      height: 52px;
      background: var(--primary-light);
      border-radius: 14px;
      display: flex;
      align-items: center;
      justify-content: center;
      margin-bottom: 20px;
    }

    .card h1 {
      font-size: 1.6rem;
      font-weight: 800;
      letter-spacing: -0.5px;
      margin-bottom: 6px;
    }

    .card .subtitle {
      font-size: 0.9rem;
      color: var(--muted);
      margin-bottom: 32px;
      line-height: 1.5;
    }

    /* ── Form fields ── */
    .field { margin-bottom: 18px; }

    label {
      display: block;
      font-size: 0.85rem;
      font-weight: 600;
      color: var(--text);
      margin-bottom: 6px;
    }

    input {
      width: 100%;
      padding: 11px 14px;
      border: 1.5px solid var(--border);
      border-radius: 9px;
      font-size: 0.95rem;
      color: var(--text);
      background: var(--card);
      outline: none;
      transition: border-color 0.15s, box-shadow 0.15s;
      font-family: inherit;
    }

    input::placeholder { color: #9ca3af; }

    input:focus {
      border-color: var(--primary);
      box-shadow: 0 0 0 3px rgba(99, 102, 241, 0.12);
    }

    /* ── Submit button ── */
    .btn-submit {
      width: 100%;
      padding: 13px;
      background: var(--primary);
      color: #fff;
      border: none;
      border-radius: 9px;
      font-size: 0.98rem;
      font-weight: 700;
      cursor: pointer;
      margin-top: 8px;
      transition: background 0.18s, transform 0.18s, box-shadow 0.18s;
      font-family: inherit;
      letter-spacing: -0.1px;
    }

    .btn-submit:hover {
      background: var(--primary-dark);
      transform: translateY(-1px);
      box-shadow: 0 6px 20px rgba(99, 102, 241, 0.35);
    }

    .btn-submit:active { transform: translateY(0); }

    /* ── Feedback message ── */
    #register-message {
      margin-top: 14px;
      font-size: 0.875rem;
      font-weight: 500;
      min-height: 20px;
      text-align: center;
      color: var(--error);
    }

    #register-message.success { color: var(--success); }

    /* ── Divider ── */
    .divider {
      display: flex;
      align-items: center;
      gap: 12px;
      margin: 24px 0 20px;
    }

    .divider::before, .divider::after {
      content: '';
      flex: 1;
      height: 1px;
      background: var(--border);
    }

    .divider span {
      font-size: 0.78rem;
      color: var(--muted);
      white-space: nowrap;
    }

    /* ── Log in link ── */
    .login-link {
      text-align: center;
      font-size: 0.875rem;
      color: var(--muted);
    }

    .login-link a {
      color: var(--primary);
      font-weight: 600;
      text-decoration: none;
    }

    .login-link a:hover { text-decoration: underline; }

    /* ── Footer ── */
    footer {
      text-align: center;
      padding: 20px;
      font-size: 0.8rem;
      color: var(--muted);
      border-top: 1px solid var(--border);
    }

    /* ── Responsive ── */
    @media (max-width: 480px) {
      .card { padding: 32px 24px; }
    }
  </style>
</head>
<body>

  <nav>
    <a href="/frontend/landing.html" class="logo">
      <div class="logo-icon">
        <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round">
          <path d="M22 11.08V12a10 10 0 1 1-5.93-9.14"/>
          <polyline points="22 4 12 14.01 9 11.01"/>
        </svg>
      </div>
      Op<span>unto</span>
    </a>
  </nav>

  <main>
    <div class="card">

      <div class="card-icon">
        <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="#6366f1" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
          <path d="M20 21v-2a4 4 0 0 0-4-4H8a4 4 0 0 0-4 4v2"/>
          <circle cx="12" cy="7" r="4"/>
        </svg>
      </div>

      <h1>Create your account</h1>
      <p class="subtitle">Start practicing interviews and land your dream job.</p>

      <div class="field">
        <label for="register-name">Full Name</label>
        <input id="register-name" type="text" placeholder="Jane Smith" autocomplete="name" />
      </div>

      <div class="field">
        <label for="register-email">Email</label>
        <input id="register-email" type="email" placeholder="jane@example.com" autocomplete="email" />
      </div>

      <div class="field">
        <label for="register-password">Password</label>
        <input id="register-password" type="password" placeholder="Min. 8 characters" autocomplete="new-password" />
      </div>

      <div class="field" id="otp-field" style="display:none">
        <label for="register-otp">Verification Code</label>
        <input id="register-otp" type="text" placeholder="6-digit code from your email" maxlength="6" autocomplete="one-time-code" />
      </div>

      <button class="btn-submit" id="register-btn" type="button" onclick="register()">Create Account</button>

      <div id="register-message"></div>

      <div class="divider"><span>Already have an account?</span></div>

      <p class="login-link"><a href="/">Log in</a></p>

    </div>
  </main>

  <footer>© 2026 Opunto</footer>

  <script src="/frontend/script.js"></script>

</body>
</html>
